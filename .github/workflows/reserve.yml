name: auto_Reserve

on:
  schedule:
    - cron: "32 09 * * *"  
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # 确保脚本内部使用北京时间
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pytz cryptography
          # 移除非必要的系统依赖安装

      - name: Verify execution time
        run: |
          echo "GitHub Actions 触发时间 (UTC): $(date -u)"
          echo "脚本执行时间 (北京时间): $(date)"
          python -c "import time; print(f'Python时区: {time.tzname}')"

      - name: Run reservation script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: python main.py -m debug --action
