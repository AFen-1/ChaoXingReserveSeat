name: auto_Reserve

on:
  schedule:
    - cron: "45 09 * * *"
    # 添加时区配置
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    # 设置时区为北京时间
    env:
      TZ: Asia/Shanghai
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pytz cryptography opencv-python-headless numpy
          
      - name: Verify time settings
        run: |
          echo "当前系统时间: $(date)"
          echo "时区信息:"
          timedatectl
          python -c "import time; print(f'Python时间: {time.ctime()}')"
          python -c "import datetime; print(f'北京时区时间: {datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))}')"

      - name: Run reservation script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: python main.py -m reserve --action
